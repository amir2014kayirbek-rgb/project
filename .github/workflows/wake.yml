# Бесплатный хостинг засыпает без запросов. Этот workflow утром «будит» сайт,
# а при пробуждении сервис сам выпускает свежий прогноз (deploy/render_start.py).
# Включение: Settings → Secrets and variables → Actions → Variables → SITE_URL = https://<имя>.onrender.com
name: Wake site

on:
  schedule:
    - cron: "40 0 * * *"   # 05:40 по UTC+5
    - cron: "0 7 * * *"    # 12:00 по UTC+5 — повторная проверка свежести
  workflow_dispatch:

jobs:
  wake:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wake and wait for fresh forecast
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 60 "${{ vars.SITE_URL }}/v1/health" -o h.json; then
              cat h.json; echo
              grep -q '"forecast_fresh":true' h.json && exit 0
            fi
            sleep 30
          done
          echo "Прогноз не обновился за 10 минут"; exit 1
