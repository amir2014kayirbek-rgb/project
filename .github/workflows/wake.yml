# Ежедневный прогноз для бесплатного хостинга.
# Open-Meteo ограничивает общий IP бесплатного Render (HTTP 429), поэтому выпуск
# считается здесь, на раннере GitHub, и отправляется на сайт по внутреннему ключу.
# Настройка (один раз), GitHub → Settings → Secrets and variables → Actions:
#   Variables: SITE_URL = https://<имя>.onrender.com
#   Secrets:   ARALSHIELD_INTERNAL_KEY = значение одноимённой переменной из Render → Environment
name: Daily forecast

on:
  schedule:
    - cron: "30 0 * * *"   # 05:30 по UTC+5
    - cron: "0 7 * * *"    # 12:00 по UTC+5 — повтор (сайт мог перезапуститься и потерять выпуск)
    - cron: "0 */3 * * *"  # каждые 3 часа — страховка, если сайт перезапустился
  workflow_dispatch:

jobs:
  forecast:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wake site
        run: |
          for i in $(seq 1 10); do
            curl -fsS --max-time 90 "${{ vars.SITE_URL }}/v1/settlements" -o /dev/null && exit 0
            sleep 20
          done
          exit 1
      - name: Issue and push forecast
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ARALSHIELD_INTERNAL_KEY: ${{ secrets.ARALSHIELD_INTERNAL_KEY }}
          PYTHONIOENCODING: utf-8
        run: python deploy/push_forecast.py
