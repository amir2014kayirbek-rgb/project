# Не даёт бесплатному Render уснуть: без запросов он засыпает через 15 минут,
# а при пробуждении теряет базу с прогнозами. Пинг каждые 10 минут, ~5 секунд работы.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.SITE_URL }}/v1/health" -o /dev/null || true
